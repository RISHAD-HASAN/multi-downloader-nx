# Content key vaults.
#
# A vault stores KID -> CONTENT KEY per service. Once a key is in there, the
# same title (or another dub sharing the same keys) decrypts without going back
# to the licence server.
#
# Local vaults are checked before network ones. Keys pulled from a licence get
# written back to every vault that isn't marked no_push.

# set false to bypass the cache entirely and always request a licence
enabled: true

key_vaults:
    # Local SQLite db. Same table layout as devine/unshackle vaults, so you can
    # point this at an existing key_vault.db. Needs Node >= 22.5 for node:sqlite.
    - type: SQLite
      name: 'Local Vault'
      path: './config/key_vault.db'

    # No-dependency fallback if you're on an older Node.
    # - type: JSON
    #   name: 'Local JSON Vault'
    #   path: './config/key_vault.json'

    # Remote HTTP vault.
    # - type: API
    #   name: 'Team Vault'
    #   uri: 'https://vault.example.com/api'
    #   token: 'your-secret-key'
    #   no_push: false     # true = read only
